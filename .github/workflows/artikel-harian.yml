name: artikel-harian

# Publish artikel otomatis per hari (07:00 WIB = 00:00 UTC).
# Trigger endpoint Zadv VPS — VPS yang koneksi DB + Gemini, bukan GH Actions.
# GH Actions cuma kirim HTTP POST, tidak butuh DATABASE_URL/GEMINI_KEY.

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 WIB
  workflow_dispatch: {}   # izinkan jalankan manual dari tab Actions

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger artikel generate di VPS
        env:
          ZADV_URL: ${{ secrets.ZADV_URL }}
          CROSS_APP_SECRET: ${{ secrets.CROSS_APP_SECRET }}
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}"             -X POST "${ZADV_URL}/api/artikel/trigger"             -H "X-Cross-App-Secret: ${CROSS_APP_SECRET}")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          if [ "$STATUS" != "200" ]; then
            echo "Trigger gagal (HTTP $STATUS)"
            exit 1
          fi
